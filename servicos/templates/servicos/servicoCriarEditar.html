{% extends "base/_base.html" %}


{% block content %}

    {% if servico %}
        <h1 class="text-2xl font-bold mb-6">Editar Serviço ✏️</h1>
    {% else %}
        <h1 class="text-2xl font-bold mb-6">Criar Novo Serviço ✨</h1>
    {% endif %}

    <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-lg">
        <form method="post" class="space-y-4">
            {% csrf_token %}

            {{ form.as_p }}
            
            <div class="flex justify-end space-x-4 mt-6">
                <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                    Salvar
                </button>
                <a href="{% url 'servicoLista' %}" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">
                    Cancelar
                </a>
            </div>
        </form>
    </div>

{% endblock content %}
